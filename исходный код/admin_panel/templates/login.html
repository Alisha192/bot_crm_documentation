<!doctype html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body style="font-family: Arial; background:#f4f6f8;">
    <div style="width:300px;margin:100px auto;background:#fff;padding:20px;">
        <h3>Вход в админку</h3>

        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}

        <form method="post">
            <input name="username" placeholder="Login" style="width:100%"><br><br>
            <input type="password" name="password" placeholder="Password" style="width:100%"><br><br>
            <button style="width:100%">Войти</button>
        </form>
    </div>
</body>
</html>
